<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winkelarten erkennen – Blatt 1</title>
<style>
:root{--bg-color:#F0DC82;--card-bg:#fff;--accent-color:#2c3e50;
--timer-bg:#fff;--timer-alert:#e74c3c;--sol-color:#27ae60;--ang-a:#2471a3;--ang-b:#ca6f1e;}
body,html{margin:0;padding:0;height:100vh;width:100vw;background-color:var(--bg-color);
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden;display:flex;flex-direction:column;}
header{height:70px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
padding:0 15px;background:rgba(0,0,0,0.05);border-bottom:3px solid var(--accent-color);box-sizing:border-box;}
.header-left{display:flex;align-items:center;gap:15px;}
h1{font-size:1.0rem;margin:0;color:var(--accent-color);max-width:300px;line-height:1.1;}
.legend{display:flex;gap:10px;align-items:center;font-size:0.74rem;color:var(--accent-color);flex-wrap:wrap;max-width:430px;}
.legend span{display:inline-flex;align-items:center;gap:4px;font-weight:bold;}
.dot{width:13px;height:13px;border-radius:3px;display:inline-block;}
.timer-container{display:flex;align-items:center;gap:8px;}
#timer-display{font-family:'Courier New',monospace;font-size:2.1rem;font-weight:bold;background:var(--timer-bg);
color:var(--accent-color);padding:2px 14px;border-radius:8px;border:3px solid var(--accent-color);min-width:118px;text-align:center;}
.controls button{cursor:pointer;padding:8px 11px;border-radius:6px;border:2px solid var(--accent-color);
background:white;font-weight:bold;font-size:0.88rem;color:var(--accent-color);transition:all .2s;
display:inline-flex;align-items:center;justify-content:center;}
.controls button:hover{background:#eee;transform:scale(1.05);}
.back-btn{background:var(--accent-color)!important;color:white!important;font-size:1.2rem!important;}
main{flex-grow:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
gap:10px;padding:10px;box-sizing:border-box;}
.task-card{background:var(--card-bg);border:3px solid var(--accent-color);border-top-width:8px;border-radius:12px;
display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative;
cursor:pointer;padding:6px 6px 4px;box-sizing:border-box;transition:background-color .2s;
box-shadow:4px 4px 0 rgba(0,0,0,0.1);overflow:hidden;}
.task-card:hover{background-color:#f9f9f9;}
.task-num{position:absolute;top:4px;left:8px;font-size:1.1rem;font-weight:bold;color:var(--accent-color);z-index: 11; }
.sketch{flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;margin-top:14px;}
.sketch svg{max-width:100%;max-height:100%;width:auto;height:auto;overflow:visible;}
.fo-lbl{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;font-weight:bold;
line-height:1;color:var(--accent-color);white-space:nowrap;font-style:italic;}
.fo-ang-a{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;font-weight:bold;color:var(--ang-a);}
.fo-ang-b{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;font-weight:bold;color:var(--ang-b);}
.question{font-size:clamp(.72rem,1.6vh,1rem);color:var(--accent-color);font-weight:600;text-align:center;line-height:1.15;margin:2px 0;}
.show-sol .question{opacity:.22;}
.solution{position:absolute;inset:0;border-radius:9px;background:rgba(255,255,255,0.95);
display:flex;flex-direction:column;align-items:center;justify-content:center;
font-size:clamp(1.2rem,4.5vh,2.5rem);color:var(--sol-color);font-weight:bold;
text-align:center;padding:12px;box-sizing:border-box;visibility:hidden;z-index:10;line-height:1.3;}
.show-sol .solution{visibility:visible;}
@media(max-width:1100px){h1,.legend{display:none;}}
</style>
</head>
<body>
<header>
 <div class="header-left">
  <div class="controls"><button class="back-btn" onclick="history.back()" title="Zurück">&#8592;</button></div>
  <h1>Winkelarten erkennen – Blatt 1</h1>
  <div class="legend">
   <span><i class="dot" style="background:var(--ang-a)"></i>&#945;</span>
   <span><i class="dot" style="background:var(--ang-b)"></i>&#946;</span>
   <span>&middot; Nebenw. &middot; Scheitelw. &middot; Stufenw. &middot; Wechselw. &middot; keiner</span>
  </div>
 </div>
 <div class="timer-container">
  <div class="controls"><button onclick="adjustTime(-60)">-1m</button></div>
  <div id="timer-display">06:00</div>
  <div class="controls">
   <button onclick="adjustTime(60)">+1m</button>
   <button id="startStopBtn" onclick="toggleTimer()">&#9654; Start</button>
   <button onclick="resetTimer()">&#8635;</button>
  </div>
 </div>
 <div class="controls">
  <button onclick="toggleAllSolutions()">&#128065; Lösungen</button>
  <button onclick="toggleFullscreen()">&#9974; Fullscreen</button>
 </div>
</header>
<main id="task-grid"></main>

e Beziehung haben &#945; und &#946;?"}];
let timeLeft=360,timerInterval=null;
function initGrid(){
 const grid=document.getElementById('task-grid');grid.innerHTML='';
 const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 const SHOW=[0,1,2,3,7,8].map(i=>TASKS[i]);
 SHOW.forEach((t,i)=>{
  const card=document.createElement('div');card.className='task-card';
  card.innerHTML=`<div class="task-num">${A[i]||(i+1)}</div>`+
   `<div class="sketch">${t.svg}</div>`+
   `<div class="question">${t.prompt}</div>`+
   `<div class="solution">${t.sol}</div>`;
  card.onclick=()=>card.classList.toggle('show-sol');
  grid.appendChild(card);
 });
}
function updateTimerDisplay(){
 const m=Math.floor(timeLeft/60).toString().padStart(2,'0');
 const s=(timeLeft%60).toString().padStart(2,'0');
 const d=document.getElementById('timer-display');d.innerText=`${m}:${s}`;
 if(timeLeft===0){d.style.backgroundColor='var(--timer-alert)';d.style.color='white';}
 else{d.style.backgroundColor='var(--timer-bg)';d.style.color='var(--accent-color)';}
}
function toggleTimer(){
 const b=document.getElementById('startStopBtn');
 if(timerInterval){clearInterval(timerInterval);timerInterval=null;b.innerText="\u25b6 Start";}
 else{if(timeLeft<=0)return;b.innerText="\u23f8 Pause";
  timerInterval=setInterval(()=>{timeLeft--;updateTimerDisplay();
   if(timeLeft<=0){clearInterval(timerInterval);timerInterval=null;b.innerText="\u25b6 Start";}},1000);}
}
function resetTimer(){if(timerInterval)toggleTimer();timeLeft=360;updateTimerDisplay();}
function adjustTime(a){timeLeft=Math.max(0,timeLeft+a);updateTimerDisplay();}
function toggleAllSolutions(){
 const c=document.querySelectorAll('.task-card');
 const any=Array.from(c).some(x=>x.classList.contains('show-sol'));
 c.forEach(x=>{if(any)x.classList.remove('show-sol');else x.classList.add('show-sol');});
}
function toggleFullscreen(){
 if(!document.fullscreenElement){document.documentElement.requestFullscreen();}
 else{if(document.exitFullscreen)document.exitFullscreen();}
}
window.onload=()=>{initGrid();updateTimerDisplay();};
</script>
</body>
</html>
