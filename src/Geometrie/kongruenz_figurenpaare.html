button:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
#sol{font-size:15px;color:#5b6475;min-width:14em;text-align:right}
#msg{max-width:36em;padding:24px;line-height:1.5}

const X0=-1,X1=31,Y0=-3,Y1=14, RATIO=(X1-X0)/(Y1-Y0);
let api=null,k=1,showSol=false,mark=false,lines=false,anim=null;
const $=id=>document.getElementById(id);
function size(){const s=$("stage");let w=s.clientWidth-16,h=s.clientHeight-16;
  if(w/h>RATIO)w=Math.floor(h*RATIO);else h=Math.floor(w/RATIO);return[w,h];}
function fit(){if(!api)return;const[w,h]=size();api.setSize(w,h);api.setCoordSystem(X0,X1,Y0,Y1);}

  return [all.findIndex(x=>x[1]===k)+1,all.length];}
function render(){const m=META[k-1],[i,n]=phaseCount();
  $("where").innerHTML=m.phase+"<small>"+i+" / "+n+"</small>";
  $("sol").textContent=showSol?(m.code+": "+m.antwort):"";
  const a5=m.atom.startsWith("Atom 5");
  $("mark").disabled=!a5;$("lines").disabled=!a5;
  $("prev").disabled=k===1;$("next").disabled=k===META.length;}
function setT(v){api&&api.setValue("t",v);}
function go(d){const nk=Math.min(META.length,Math.max(1,k+d));if(nk===k)return;k=nk;
  stop();setT(0);api.setValue("n",k);render();}
function stop(){if(anim){cancelAnimationFrame(anim);anim=null;}}
function play(){if(!api)return;stop();const t0=performance.now(),D=matchMedia("(prefers-reduced-motion: reduce)").matches?1:2200;
  const step=now=>{let x=Math.min(1,(now-t0)/D);x=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;setT(x);
    if(x<1)anim=requestAnimationFrame(step);else anim=null;};anim=requestAnimationFrame(step);}
function toggle(which){if(which==="mark"){mark=!mark;api.setValue("markieren",mark?1:0);$("mark").setAttribute("aria-pressed",mark);}
  else{lines=!lines;api.setValue("linien",lines?1:0);$("lines").setAttribute("aria-pressed",lines);}}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("play").onclick=play;
$("reset").onclick=()=>{stop();setT(0);};
$("mark").onclick=()=>toggle("mark");$("lines").onclick=()=>toggle("lines");
$("solbtn").onclick=()=>{showSol=!showSol;$("solbtn").setAttribute("aria-pressed",showSol);render();};
document.addEventListener("keydown",e=>{if(!api)return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){go(1);e.preventDefault();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){go(-1);e.preventDefault();}
  else if(e.key===" "){play();e.preventDefault();}
  else if(e.key==="r"||e.key==="R"){stop();setT(0);}
  else if((e.key==="m"||e.key==="M")&&!$("mark").disabled)toggle("mark");
  else if((e.key==="v"||e.key==="V")&&!$("lines").disabled)toggle("lines");
  else if(e.key==="l"||e.key==="L")$("solbtn").click();});

window.addEventListener("load",()=>{

  const[w,h]=size();

    showMenuBar:false,enableRightClick:false,enableShiftDragZoom:false,showResetIcon:false,enableLabelDrags:false,
    showZoomButtons:false,showFullscreenButton:false,
    appletOnLoad:function(a){api=a;$("msg").remove();
      api.setRepaintingActive(false);
      api.setAxesVisible(false,false);api.setGridVisible(false);
      CMDS.forEach(c=>api.evalCommand(c));

      api.setRepaintingActive(true);fit();api.setValue("n",1);setT(0);render();}},true);
  app.inject("ggb");});
