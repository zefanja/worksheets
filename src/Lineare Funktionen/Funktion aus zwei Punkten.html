<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Grid: Lineare Funktionen (2 Punkte)</title>
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            chtml: { scale: 1.2 }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #F0DC82; /* Buff-Farbe zur Stressreduktion */
            --card-bg: #ffffff;
            --accent-color: #1a2a3a; /* Dunkelblau für hohen Kontrast */
            --timer-bg: #ffffff;
            --timer-alert: #e74c3c;
            --sol-color: #27ae60;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            color: var(--accent-color);
        }

        header {
            height: 80px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(0,0,0,0.03);
            border-bottom: 4px solid var(--accent-color);
            box-sizing: border-box;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            line-height: 1.2;
            max-width: 250px;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            font-weight: bold;
            background: var(--timer-bg);
            padding: 2px 20px;
            border-radius: 10px;
            border: 3px solid var(--accent-color);
            min-width: 130px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .controls button {
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            background: white;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--accent-color);
            transition: all 0.2s;
        }

        .controls button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .back-btn {
            background: var(--accent-color) !important;
            color: white !important;
            font-size: 1.3rem !important;
        }

        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
        }

        .task-card {
            background: var(--card-bg);
            border: 3px solid var(--accent-color);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.05);
            text-align: center;
            padding: 5px;
        }

        .task-card:hover {
            border-color: #34495e;
            background-color: #fdfdfd;
        }

        .task-num {
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 1.3rem;
            font-weight: 900;
            opacity: 0.7;
        z-index: 11; }

        .question {
            font-size: clamp(1rem, 3.2vh, 2.5rem);
            color: var(--accent-color);
            margin-bottom: 8px;
            width: 90%;
        }

        .solution {
            position: absolute; inset: 0; border-radius: 9px;
            background: rgba(255,255,255,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: clamp(1.1rem,3.5vh,2.2rem); color: var(--sol-color); font-weight: bold;
            text-align: center; padding: 12px; box-sizing: border-box;
            visibility: hidden; z-index: 10; line-height: 1.4;
        }

        .show-sol .question {
            opacity: 0.15;
        }

        .show-sol .solution {
            visibility: visible;
        }

        @media (max-width: 1000px) {
            h1 { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="controls">
            <button class="back-btn" onclick="history.back()" title="Zurück">←</button>
        </div>
        <h1>Lineare Funktionen aus zwei Punkten</h1>
    </div>
    
    <div class="timer-container">
        <div class="controls">
            <button onclick="adjustTime(-60)">-1m</button>
        </div>
        <div id="timer-display">15:00</div>
        <div class="controls">
            <button onclick="adjustTime(60)">+1m</button>
            <button id="startStopBtn" onclick="toggleTimer()">▶ Start</button>
            <button onclick="resetTimer()">↻</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleAllSolutions()">👁 Lösungen</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
</header>

<main id="task-grid"></main>

<script>
    const tasks = [
        // Level 1: Grundlagen (1-6)
        { q: "P(0|1), Q(1|2)", a: "y = x + 1" },
        { q: "P(0|0), Q(2|4)", a: "y = 2x" },
        { q: "P(1|3), Q(2|5)", a: "y = 2x + 1" },
        { q: "P(2|2), Q(4|3)", a: "y = 0,5x + 1" },
        { q: "P(1|4), Q(3|10)", a: "y = 3x + 1" },
        { q: "P(0|5), Q(5|10)", a: "y = x + 5" },

        // Level 2: Mittleres Niveau (7-12)
        { q: "P(1|2), Q(2|0)", a: "y = -2x + 4" },
        { q: "P(0|3), Q(2|2)", a: "y = -0,5x + 3" },
        { q: "P(-1|1), Q(1|3)", a: "y = x + 2" },
        { q: "P(2|5), Q(4|5)", a: "y = 5" },
        { q: "P(-2|0), Q(0|4)", a: "y = 2x + 4" },
        { q: "P(1|1), Q(5|2)", a: "y = 0,25x + 0,75" },

        // Level 3: Komplexe Fälle (13-18)
        { q: "P(-2|7), Q(2|-1)", a: "y = -2x + 3" },
        { q: "P(1|2), Q(3|3)", a: "y = 0,5x + 1,5" },
        { q: "P(10|10), Q(20|40)", a: "y = 3x - 20" },
        { q: "P(-1|-1), Q(1|-5)", a: "y = -2x - 3" },
        { q: "P(4|1), Q(8|0)", a: "y = -0,25x + 2" },
        { q: "P(1|0,5), Q(3|1,5)", a: "y = 0,5x" }
    ];

    let timeLeft = 900; 
    let timerInterval = null;

    function initGrid() {
        const grid = document.getElementById('task-grid');
        grid.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        
        tasks.forEach((task, index) => {
            const card = document.createElement('div');
            card.className = 'task-card';
            const label = alphabet[index] || (index + 1);
            
            card.innerHTML = `
                <div class="task-num">${label}</div>
                <div class="question">\\(${task.q}\\)</div>
                <div class="solution">\\(${task.a}\\)</div>
            `;
            
            card.onclick = () => card.classList.toggle('show-sol');
            grid.appendChild(card);
        });

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function updateTimerDisplay() {
        const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const sec = (timeLeft % 60).toString().padStart(2, '0');
        const display = document.getElementById('timer-display');
        display.innerText = `${min}:${sec}`;
        
        if (timeLeft === 0) {
            display.style.backgroundColor = 'var(--timer-alert)';
            display.style.color = 'white';
        } else {
            display.style.backgroundColor = 'var(--timer-bg)';
            display.style.color = 'var(--accent-color)';
        }
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.innerText = "▶ Start";
        } else {
            if (timeLeft <= 0) return;
            btn.innerText = "Ⅱ Pause";
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    btn.innerText = "▶ Start";
                }
            }, 1000);
        }
    }

    function resetTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timeLeft = 900;
        document.getElementById('startStopBtn').innerText = "▶ Start";
        updateTimerDisplay();
    }

    function adjustTime(amount) {
        timeLeft = Math.max(0, timeLeft + amount);
        updateTimerDisplay();
    }

    function toggleAllSolutions() {
        const cards = document.querySelectorAll('.task-card');
        const anyVisible = Array.from(cards).some(c => c.classList.contains('show-sol'));
        cards.forEach(c => {
            if (anyVisible) c.classList.remove('show-sol');
            else c.classList.add('show-sol');
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Fehler beim Wechsel in Vollbild: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    window.onload = () => {
        initGrid();
        updateTimerDisplay();
    };
</script>

</body>
</html>
