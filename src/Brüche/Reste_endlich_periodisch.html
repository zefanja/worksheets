<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Grid: Reste einer Division – endlich oder periodisch?</title>
    <style>
        :root {
            --bg-color: #F0DC82;
            --card-bg: #ffffff;
            --accent-color: #2c3e50;
            --timer-bg: #fff;
            --timer-alert: #e74c3c;
            --sol-color: #27ae60;
        }
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }
        header {
            height: 70px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: space-between; padding: 0 15px;
            background: rgba(0,0,0,0.05); border-bottom: 3px solid var(--accent-color);
            box-sizing: border-box;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        h1 { font-size: 1.1rem; margin: 0; color: var(--accent-color); max-width: 300px; line-height: 1.1; }
        .timer-container { display: flex; align-items: center; gap: 10px; }
        #timer-display {
            font-family: 'Courier New', monospace; font-size: 2.2rem; font-weight: bold;
            background: var(--timer-bg); color: var(--accent-color); padding: 2px 15px;
            border-radius: 8px; border: 3px solid var(--accent-color); min-width: 120px; text-align: center;
        }
        .controls button {
            cursor: pointer; padding: 8px 12px; border-radius: 6px; border: 2px solid var(--accent-color);
            background: white; font-weight: bold; font-size: 0.9rem; color: var(--accent-color);
            transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
        }
        .controls button:hover { background: #eee; transform: scale(1.05); }
        .back-btn { background: var(--accent-color) !important; color: white !important; font-size: 1.2rem !important; }
        .subheader {
            flex-shrink: 0; padding: 6px 15px; background: rgba(0,0,0,0.03);
            border-bottom: 2px solid var(--accent-color); font-size: 0.95rem;
            color: var(--accent-color); text-align: center; box-sizing: border-box;
        }
        main {
            flex-grow: 1; display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr); gap: 10px; padding: 10px; box-sizing: border-box;
        }
        .task-card {
            background: var(--card-bg); border: 3px solid var(--accent-color); border-top-width: 8px;
            border-radius: 12px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; position: relative; cursor: pointer;
            transition: transform 0.1s, background-color 0.2s; box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        .task-card:hover { background-color: #f9f9f9; }
        .task-num { position: absolute; top: 5px; left: 8px; font-size: 1.2rem; font-weight: bold; color: #2c3e50; z-index: 11; }
        .question { font-size: clamp(1.4rem, 4.2vh, 2.6rem); font-weight: bold; color: var(--accent-color); margin-bottom: 5px; text-align: center; line-height: 1.3; padding: 0 8px; }
        .question .label { display: block; font-size: 0.6em; font-weight: normal; opacity: 0.7; margin-bottom: 2px; }
        .show-sol .question { opacity: 0.2; }
        .solution {
            position: absolute; inset: 0; border-radius: 9px;
            background: rgba(255,255,255,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: clamp(1.1rem,3vh,1.9rem); color: var(--sol-color); font-weight: bold;
            text-align: center; padding: 12px; box-sizing: border-box;
            visibility: hidden; z-index: 10; line-height: 1.35;
        }
        .solution .reason { display: block; font-size: 0.55em; font-weight: normal; color: var(--accent-color); margin-top: 4px; }
        .show-sol .solution { visibility: visible; }
        @media (max-width: 900px) { h1 { display: none; } }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <div class="controls"><button class="back-btn" onclick="history.back()" title="Zurück">←</button></div>
        <h1>Reste einer Division: endlich (e) oder periodisch (p)?</h1>
    </div>
    <div class="timer-container">
        <div class="controls"><button onclick="adjustTime(-60)">-1m</button></div>
        <div id="timer-display">10:00</div>
        <div class="controls">
            <button onclick="adjustTime(60)">+1m</button>
            <button id="startStopBtn" onclick="toggleTimer()">▶ Start</button>
            <button onclick="resetTimer()">↻</button>
        </div>
    </div>
    <div class="controls">
        <button onclick="toggleAllSolutions()">👁 Lösungen</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
</header>
<div class="subheader">Das sind die Reste einer schriftlichen Division. Endet die Dezimalzahl (e) oder ist sie periodisch (p)?</div>
<main id="task-grid"></main>
<script>
    const levels = [
  {
    "hint": "Leicht: 2 Reste",
    "tasks": [
      { "q": "4, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." },
      { "q": "3, 3", "a": "periodisch (p)", "reason": "Der Rest 3 wiederholt sich sofort." },
      { "q": "6, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." }
    ]
  },
  {
    "hint": "Leicht: 3 Reste",
    "tasks": [
      { "q": "5, 2, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." },
      { "q": "1, 4, 4", "a": "periodisch (p)", "reason": "Der Rest 4 wiederholt sich." },
      { "q": "7, 3, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." }
    ]
  },
  {
    "hint": "Mittel: 4 Reste, Wiederholung mit Abstand",
    "tasks": [
      { "q": "2, 5, 8, 5", "a": "periodisch (p)", "reason": "Der Rest 5 wiederholt sich (2. und 4. Rest)." },
      { "q": "1, 6, 4, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." },
      { "q": "3, 7, 2, 7", "a": "periodisch (p)", "reason": "Der Rest 7 wiederholt sich (2. und 4. Rest)." }
    ]
  },
  {
    "hint": "Mittel: 5 Reste",
    "tasks": [
      { "q": "4, 8, 1, 6, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." },
      { "q": "2, 9, 5, 3, 9", "a": "periodisch (p)", "reason": "Der Rest 9 wiederholt sich (2. und 5. Rest)." },
      { "q": "6, 1, 4, 8, 4", "a": "periodisch (p)", "reason": "Der Rest 4 wiederholt sich (3. und 5. Rest)." }
    ]
  },
  {
    "hint": "Schwer: 6 Reste, genau hinschauen",
    "tasks": [
      { "q": "3, 12, 7, 21, 15, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0 (12 und 21 sind verschieden!)." },
      { "q": "5, 14, 9, 2, 8, 14", "a": "periodisch (p)", "reason": "Der Rest 14 wiederholt sich (2. und 6. Rest)." },
      { "q": "8, 17, 25, 4, 12, 4", "a": "periodisch (p)", "reason": "Der Rest 4 wiederholt sich (4. und 6. Rest)." }
    ]
  },
  {
    "hint": "Schwer: 7 Reste, ganze Liste durchsuchen",
    "tasks": [
      { "q": "9, 18, 27, 13, 31, 6, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0 (13 und 31 sind verschieden!)." },
      { "q": "7, 16, 34, 43, 21, 39, 16", "a": "periodisch (p)", "reason": "Der Rest 16 wiederholt sich (2. und 7. Rest)." },
      { "q": "14, 28, 41, 17, 33, 22, 0", "a": "endlich (e)", "reason": "Der letzte Rest ist 0." }
    ]
  }
];
    let timeLeft = 600;
    let timerInterval = null;

    function initGrid() {
        const grid = document.getElementById('task-grid');
        grid.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let taskIndex = 0;
        levels.forEach((level, levelIdx) => {
            const lightness = 60 - levelIdx * 6;
            const topColor = `hsl(210, 40%, ${lightness}%)`;
            level.tasks.forEach((task) => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.style.borderTopColor = topColor;
                const letter = alphabet[taskIndex] || (taskIndex + 1);
                card.innerHTML = `<div class="task-num">${letter}</div>
                    <div class="question"><span class="label">Reste</span>${task.q}</div>
                    <div class="solution">${task.a}<span class="reason">${task.reason}</span></div>`;
                card.onclick = () => card.classList.toggle('show-sol');
                grid.appendChild(card);
                taskIndex++;
            });
        });
    }
    function updateTimerDisplay() {
        const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const sec = (timeLeft % 60).toString().padStart(2, '0');
        const display = document.getElementById('timer-display');
        display.innerText = `${min}:${sec}`;
        if (timeLeft === 0) { display.style.backgroundColor = 'var(--timer-alert)'; display.style.color = 'white'; }
        else { display.style.backgroundColor = 'var(--timer-bg)'; display.style.color = 'var(--accent-color)'; }
    }
    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; btn.innerText = "▶ Start"; }
        else {
            if (timeLeft <= 0) return;
            btn.innerText = "Ⅱ Pause";
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerDisplay();
                if (timeLeft <= 0) { clearInterval(timerInterval); timerInterval = null; btn.innerText = "▶ Start"; }
            }, 1000);
        }
    }
    function resetTimer() { if (timerInterval) toggleTimer(); timeLeft = 600; updateTimerDisplay(); }
    function adjustTime(amount) { timeLeft = Math.max(0, timeLeft + amount); updateTimerDisplay(); }
    function toggleAllSolutions() {
        const cards = document.querySelectorAll('.task-card');
        const anyVisible = Array.from(cards).some(c => c.classList.contains('show-sol'));
        cards.forEach(c => { if (anyVisible) c.classList.remove('show-sol'); else c.classList.add('show-sol'); });
    }
    function toggleFullscreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
        else { if (document.exitFullscreen) document.exitFullscreen(); }
    }
    window.onload = () => { initGrid(); updateTimerDisplay(); };
</script>
</body>
</html>
