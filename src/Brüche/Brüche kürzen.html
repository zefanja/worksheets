<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Grid: Brüche kürzen</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            chtml: { scale: 1.2 } // Skalierung wie angefordert
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #F0DC82; /* Buff - Reduziert visuellen Stress */
            --card-bg: #ffffff;
            --accent-color: #2c3e50; /* Hoher Kontrast */
            --timer-bg: #fff;
            --timer-alert: #e74c3c;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; /* Absolutes Scroll-Verbot */
            display: flex;
            flex-direction: column;
        }

        /* Header - Kompakt für maximale Grid-Fläche */
        header {
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: rgba(0,0,0,0.05);
            border-bottom: 2px solid var(--accent-color);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--accent-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            font-weight: bold;
            background: var(--timer-bg);
            color: var(--accent-color);
            padding: 2px 12px;
            border-radius: 5px;
            border: 2px solid var(--accent-color);
            min-width: 100px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        button {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            border: 2px solid var(--accent-color);
            background: white;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--accent-color);
            transition: background 0.2s;
        }

        button:hover { background: #e0e0e0; }
        button:active { transform: translateY(1px); }

        /* Das Haupt-Grid */
        main {
            flex-grow: 1;
            display: grid;
            /* Vorgabe: 3 Horizontal, 6 Vertikal */
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        .task-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            text-align: center;
            transition: transform 0.1s;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .task-card:hover {
            background-color: #fafafa;
        }

        .task-num {
            position: absolute;
            top: 2px;
            left: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
        z-index: 11; }

        /* Dynamische Schriftgröße: Clamp angepasst an Brüche (die höher sind als normale Zahlen) */
        .question {
            font-size: clamp(1rem, 2.5vh, 2.2rem);
            margin-bottom: 12px;
            color: var(--accent-color);
            transition: opacity 0.3s ease;
        }

        .show-sol .question {
            opacity: 0.3; /* Aufgabe verblasst */
        }

        .solution {
            position: absolute; inset: 0; border-radius: 9px;
            background: rgba(255,255,255,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: clamp(1.1rem,3.5vh,2.2rem); color: var(--sol-color); font-weight: bold;
            text-align: center; padding: 12px; box-sizing: border-box;
            visibility: hidden; z-index: 10; line-height: 1.4;
        }

        .show-sol .solution {
            visibility: visible;
        }

        /* Fullscreen Anpassung */
        :fullscreen body { background-color: var(--bg-color); }
        
        /* Media Query für sehr kleine Bildschirme (Safety Fallback) */
        @media (max-width: 600px) {
            header h1 { display: none; }
        }
    </style>
</head>
<body>

<header>
    <h1>Mathe-Grid: Brüche kürzen</h1>
    
    <div class="timer-area">
        <button onclick="changeTime(-60)">-1m</button>
        <div id="timer-display">15:00</div>
        <button onclick="changeTime(60)">+1m</button>
        <button id="startBtn" onclick="toggleTimer()">▶ Start</button>
        <button onclick="resetTimer()">↻ Reset</button>
    </div>

    <div class="btn-group">
        <button onclick="toggleAll()">👁 Lösungen</button>
        <button onclick="toggleFS()">⛶ Fullscreen</button>
    </div>
</header>

<main id="grid-container"></main>

<script>
    // Aufgaben-Logik: 1-6 (Basis), 7-12 (Mittel), 13-18 (Komplex)
    const tasks = [
        // Level 1: Grundlagen (Kleine Zahlen, offensichtliche Teiler)
        { q: "\\frac{2}{4}", a: "\\frac{1}{2}" },
        { q: "\\frac{5}{10}", a: "\\frac{1}{2}" },
        { q: "\\frac{3}{9}", a: "\\frac{1}{3}" },
        { q: "\\frac{4}{12}", a: "\\frac{1}{3}" },
        { q: "\\frac{6}{8}", a: "\\frac{3}{4}" },
        { q: "\\frac{10}{100}", a: "\\frac{1}{10}" },

        // Level 2: Mittleres Niveau (Einmaleins)
        { q: "\\frac{12}{16}", a: "\\frac{3}{4}" },
        { q: "\\frac{15}{20}", a: "\\frac{3}{4}" },
        { q: "\\frac{18}{24}", a: "\\frac{3}{4}" },
        { q: "\\frac{24}{36}", a: "\\frac{2}{3}" },
        { q: "\\frac{14}{21}", a: "\\frac{2}{3}" },
        { q: "\\frac{35}{45}", a: "\\frac{7}{9}" },

        // Level 3: Komplex (Größere Zahlen, Teiler 11-15, Primzahlen)
        { q: "\\frac{42}{56}", a: "\\frac{3}{4}" }, // Teiler 14
        { q: "\\frac{45}{75}", a: "\\frac{3}{5}" }, // Teiler 15
        { q: "\\frac{60}{72}", a: "\\frac{5}{6}" }, // Teiler 12
        { q: "\\frac{48}{64}", a: "\\frac{3}{4}" }, // Teiler 16
        { q: "\\frac{33}{121}", a: "\\frac{3}{11}" }, // Teiler 11
        { q: "\\frac{52}{65}", a: "\\frac{4}{5}" }   // Teiler 13 (Tricky!)
    ];

    let timeLeft = 900; // 15 Minuten
    let timerRunning = false;
    let interval;

    function init() {
        const grid = document.getElementById('grid-container');
        grid.innerHTML = ''; // Clear existing
        
        tasks.forEach((t, i) => {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.onclick = () => card.classList.toggle('show-sol');
            
            const letter = String.fromCharCode(65 + i); // 65 ist 'A' im ASCII-Code
            
            // Aufbau: Nummer links oben, Frage mitte, Lösung unten
            card.innerHTML = `
                <div class="task-num">${letter}</div>
                <div class="question">\\(${t.q}\\)</div>
                <div class="solution">\\(${t.a}\\)</div>
            `;
            grid.appendChild(card);
        });

        // MathJax rendern
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
        
        updateTimer();
    }

    function updateTimer() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2,'0');
        const s = (timeLeft % 60).toString().padStart(2,'0');
        const display = document.getElementById('timer-display');
        display.innerText = `${m}:${s}`;
        
        // Visuelles Feedback wenn Zeit abgelaufen
        if (timeLeft === 0) {
            display.style.backgroundColor = 'var(--timer-alert)';
            display.style.color = 'white';
        } else {
            display.style.backgroundColor = 'var(--timer-bg)';
            display.style.color = 'var(--accent-color)';
        }
    }

    function toggleTimer() {
        const b = document.getElementById('startBtn');
        if (timerRunning) { 
            clearInterval(interval); 
            b.innerText = "▶ Start"; 
        } else {
            if (timeLeft > 0) {
                interval = setInterval(() => { 
                    if(timeLeft > 0){ 
                        timeLeft--; 
                        updateTimer(); 
                    } else {
                        clearInterval(interval);
                        timerRunning = false;
                        b.innerText = "▶ Start";
                    }
                }, 1000);
                b.innerText = "Ⅱ Pause";
            }
        }
        timerRunning = !timerRunning;
    }

    function resetTimer() { 
        timeLeft = 900; 
        updateTimer(); 
        if(timerRunning) toggleTimer(); // Stoppen beim Reset
    }

    function changeTime(s) { 
        timeLeft = Math.max(0, timeLeft + s); 
        updateTimer(); 
    }
    
    function toggleAll() {
        const cards = document.querySelectorAll('.task-card');
        // Prüfen ob irgendeine Karte offen ist
        const anyOpen = Array.from(cards).some(c => c.classList.contains('show-sol'));
        
        if (anyOpen) {
            // Wenn min. eine offen -> alle schließen
            cards.forEach(c => c.classList.remove('show-sol'));
        } else {
            // Wenn alle zu -> alle öffnen
            cards.forEach(c => c.classList.add('show-sol'));
        }
    }

    function toggleFS() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(e => {
                console.log("Fullscreen error: ", e);
            });
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    // Start
    window.onload = init;
</script>
</body>
</html>
