<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Grid: Brüche vergleichen</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            chtml: { scale: 1.05 }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #F8BBD0;
            --card-bg: #ffffff;
            --accent-color: #880e4f;
            --timer-bg: #fff;
            --timer-alert: #e74c3c;
            --sol-color: #c2185b;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        header {
            height: 70px; flex-shrink: 0;
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: rgba(0,0,0,0.05);
            border-bottom: 3px solid var(--accent-color);
            box-sizing: border-box;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }

        h1 {
            font-size: 1.05rem; margin: 0;
            color: var(--accent-color);
            max-width: 220px; line-height: 1.2;
        }

        .timer-container { display: flex; align-items: center; gap: 10px; }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 2.2rem; font-weight: bold;
            background: var(--timer-bg); color: var(--accent-color);
            padding: 2px 15px; border-radius: 8px;
            border: 3px solid var(--accent-color);
            min-width: 120px; text-align: center;
        }

        .controls button {
            cursor: pointer; padding: 8px 12px;
            border-radius: 6px; border: 2px solid var(--accent-color);
            background: white; font-weight: bold;
            font-size: 0.9rem; color: var(--accent-color);
            transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .controls button:hover { background: #eee; transform: scale(1.05); }
        .back-btn {
            background: var(--accent-color) !important;
            color: white !important; font-size: 1.2rem !important;
        }

        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 10px; padding: 10px;
            box-sizing: border-box;
        }

        /* ── Card ─────────────────────────────────────────────────────────── */
        .task-card {
            background: var(--card-bg);
            border: 3px solid var(--accent-color);
            border-radius: 12px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 18px 6px 6px;
        }
        .task-card:hover { background-color: #fff0f5; }

        /* coloured top stripe per strategy */
        .task-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 6px; border-radius: 9px 9px 0 0;
        }
        .s1::before { background: #1565c0; } /* gleicher Nenner  */
        .s2::before { background: #2e7d32; } /* gleicher Zähler  */
        .s3::before { background: #e65100; } /* Vergleich mit ½  */
        .s4::before { background: #6a1b9a; } /* Vielfaches       */
        .s5::before { background: #4e342e; } /* kgV              */

        .task-num {
            position: absolute; top: 9px; left: 10px;
            font-size: 1.05rem; font-weight: bold; color: var(--accent-color);
        }

        /* strategy badge */
        .strat-badge {
            position: absolute; top: 9px; right: 8px;
            font-size: 0.58rem; font-weight: bold;
            padding: 2px 6px; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 0.03em;
        }
        .s1 .strat-badge { background: #bbdefb; color: #1565c0; }
        .s2 .strat-badge { background: #c8e6c9; color: #2e7d32; }
        .s3 .strat-badge { background: #ffe0b2; color: #e65100; }
        .s4 .strat-badge { background: #e1bee7; color: #6a1b9a; }
        .s5 .strat-badge { background: #d7ccc8; color: #4e342e; }

        /* question & solution */
        .question {
            font-size: clamp(0.9rem, 2.6vh, 2rem);
            color: var(--accent-color);
            margin-bottom: 3px;
            text-align: center; padding: 0 4px;
        }
        .show-sol .question { opacity: 0.18; }

        /* answer: show the symbol large + bold */
        .sol-symbol {
            font-size: clamp(1.4rem, 4.5vh, 3.2rem);
            font-weight: 900;
            color: var(--sol-color);
            line-height: 1;
            visibility: hidden;
            border-top: 2px dashed #ddd;
            width: 60%; text-align: center;
            padding-top: 4px;
        }
        .show-sol .sol-symbol { visibility: visible; }

        @media (max-width: 900px) { h1 { display: none; } }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="controls">
            <button class="back-btn" onclick="history.back()" title="Zurück">←</button>
        </div>
        <h1>Brüche vergleichen (&lt;, &gt;, =)</h1>
    </div>

    <div class="timer-container">
        <div class="controls"><button onclick="adjustTime(-60)">-1m</button></div>
        <div id="timer-display">15:00</div>
        <div class="controls">
            <button onclick="adjustTime(60)">+1m</button>
            <button id="startStopBtn" onclick="toggleTimer()">▶ Start</button>
            <button onclick="resetTimer()">↻</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleAllSolutions()">👁 Lösungen</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
</header>

<main id="task-grid"></main>

<script>
    /*
     * s1 – gleicher Nenner   (direkter Zählervergleich)
     * s2 – gleicher Zähler   (direkter Nennervergleich)
     * s3 – Vergleich mit ½   (Hälfte als Anker)
     * s4 – Nenner Vielfaches  (ein Nenner ist Vielfaches des anderen)
     * s5 – kgV nötig         (echtes Gleichnamigmachen)
     */
    const tasks = [
        // ── s1: Gleicher Nenner ─────────────────────────────────────────────
        { s:"s1", badge:"gl. Nenner",
          q:"\\frac{3}{8} \\mathbin{\\square} \\frac{5}{8}", sym:"<" },
        { s:"s1", badge:"gl. Nenner",
          q:"\\frac{5}{6} \\mathbin{\\square} \\frac{2}{6}", sym:">" },
        { s:"s1", badge:"gl. Nenner",
          q:"\\frac{7}{12} \\mathbin{\\square} \\frac{7}{12}", sym:"=" },

        // ── s2: Gleicher Zähler ─────────────────────────────────────────────
        { s:"s2", badge:"gl. Zähler",
          q:"\\frac{3}{4} \\mathbin{\\square} \\frac{3}{8}", sym:">" },
        { s:"s2", badge:"gl. Zähler",
          q:"\\frac{2}{5} \\mathbin{\\square} \\frac{2}{3}", sym:"<" },
        { s:"s2", badge:"gl. Zähler",
          q:"\\frac{5}{6} \\mathbin{\\square} \\frac{5}{9}", sym:">" },

        // ── s3: Vergleich mit ½ ─────────────────────────────────────────────
        { s:"s3", badge:"Anker ½",
          q:"\\frac{3}{8} \\mathbin{\\square} \\frac{1}{2}", sym:"<" },
        { s:"s3", badge:"Anker ½",
          q:"\\frac{5}{9} \\mathbin{\\square} \\frac{1}{2}", sym:">" },
        { s:"s3", badge:"Anker ½",
          q:"\\frac{7}{12} \\mathbin{\\square} \\frac{1}{2}", sym:">" },

        // ── s4: Nenner-Vielfache ─────────────────────────────────────────────
        { s:"s4", badge:"Vielfaches",
          q:"\\frac{3}{5} \\mathbin{\\square} \\frac{7}{10}", sym:"<" },
        { s:"s4", badge:"Vielfaches",
          q:"\\frac{1}{4} \\mathbin{\\square} \\frac{3}{8}", sym:"<" },
        { s:"s4", badge:"Vielfaches",
          q:"\\frac{3}{4} \\mathbin{\\square} \\frac{6}{8}", sym:"=" },

        // ── s5: kgV nötig ───────────────────────────────────────────────────
        { s:"s5", badge:"kgV",
          q:"\\frac{2}{3} \\mathbin{\\square} \\frac{3}{4}", sym:"<" },
        { s:"s5", badge:"kgV",
          q:"\\frac{1}{3} \\mathbin{\\square} \\frac{2}{5}", sym:"<" },
        { s:"s5", badge:"kgV",
          q:"\\frac{3}{4} \\mathbin{\\square} \\frac{7}{10}", sym:">" },
        { s:"s5", badge:"kgV",
          q:"\\frac{5}{8} \\mathbin{\\square} \\frac{2}{3}", sym:"<" },
        { s:"s5", badge:"kgV",
          q:"\\frac{3}{5} \\mathbin{\\square} \\frac{4}{7}", sym:">" },
        { s:"s5", badge:"kgV",
          q:"\\frac{2}{5} \\mathbin{\\square} \\frac{3}{8}", sym:">" },
    ];

    let timeLeft = 900;
    let timerInterval = null;

    function initGrid() {
        const grid = document.getElementById('task-grid');
        grid.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        tasks.forEach((task, index) => {
            const card = document.createElement('div');
            card.className = `task-card ${task.s}`;
            const label = alphabet[index];

            // escape HTML entities for < and > in the symbol
            const symHTML = task.sym === '<' ? '&lt;'
                          : task.sym === '>' ? '&gt;'
                          : '=';

            card.innerHTML = `
                <div class="task-num">${label}</div>
                <div class="strat-badge">${task.badge}</div>
                <div class="question">\\(${task.q}\\)</div>
                <div class="sol-symbol">${symHTML}</div>
            `;

            card.onclick = () => card.classList.toggle('show-sol');
            grid.appendChild(card);
        });

        if (window.MathJax) MathJax.typesetPromise();
    }

    function updateTimerDisplay() {
        const min = Math.floor(timeLeft / 60).toString().padStart(2,'0');
        const sec = (timeLeft % 60).toString().padStart(2,'0');
        const d = document.getElementById('timer-display');
        d.innerText = `${min}:${sec}`;
        d.style.backgroundColor = timeLeft === 0 ? 'var(--timer-alert)' : 'var(--timer-bg)';
        d.style.color = timeLeft === 0 ? 'white' : 'var(--accent-color)';
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (timerInterval) {
            clearInterval(timerInterval); timerInterval = null;
            btn.innerText = "▶ Start";
        } else {
            if (timeLeft <= 0) return;
            btn.innerText = "Ⅱ Pause";
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval); timerInterval = null;
                    btn.innerText = "▶ Start";
                }
            }, 1000);
        }
    }

    function resetTimer() {
        if (timerInterval) toggleTimer();
        timeLeft = 900; updateTimerDisplay();
    }

    function adjustTime(amount) {
        timeLeft = Math.max(0, timeLeft + amount); updateTimerDisplay();
    }

    function toggleAllSolutions() {
        const cards = document.querySelectorAll('.task-card');
        const anyVisible = [...cards].some(c => c.classList.contains('show-sol'));
        cards.forEach(c => anyVisible
            ? c.classList.remove('show-sol')
            : c.classList.add('show-sol'));
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    }

    window.onload = () => { initGrid(); updateTimerDisplay(); };
</script>
</body>
</html>
