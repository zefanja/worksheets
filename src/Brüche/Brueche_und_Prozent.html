<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Grid: Brüche und Prozent</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            chtml: { scale: 1.1 }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #E0F7FA;
            --card-bg: #ffffff;
            --accent-color: #006064;
            --timer-bg: #fff;
            --timer-alert: #e74c3c;
            --sol-color: #00838f;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        header {
            height: 70px; flex-shrink: 0;
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: rgba(0,0,0,0.05);
            border-bottom: 3px solid var(--accent-color);
            box-sizing: border-box;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }

        h1 {
            font-size: 1.05rem; margin: 0;
            color: var(--accent-color);
            max-width: 220px; line-height: 1.2;
        }

        .timer-container { display: flex; align-items: center; gap: 10px; }

        #timer-display {
            font-family: 'Courier New', monospace;
            font-size: 2.2rem; font-weight: bold;
            background: var(--timer-bg); color: var(--accent-color);
            padding: 2px 15px; border-radius: 8px;
            border: 3px solid var(--accent-color);
            min-width: 120px; text-align: center;
        }

        .controls button {
            cursor: pointer; padding: 8px 12px;
            border-radius: 6px; border: 2px solid var(--accent-color);
            background: white; font-weight: bold;
            font-size: 0.9rem; color: var(--accent-color);
            transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .controls button:hover { background: #eee; transform: scale(1.05); }
        .back-btn {
            background: var(--accent-color) !important;
            color: white !important; font-size: 1.2rem !important;
        }

        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 10px; padding: 10px;
            box-sizing: border-box;
        }

        .task-card {
            background: var(--card-bg);
            border: 3px solid var(--accent-color);
            border-radius: 12px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .task-card:hover { background-color: #e0fafa; }

        /* coloured top stripe per direction */
        .task-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 6px; border-radius: 9px 9px 0 0;
        }
        .dir-to-pct::before  { background: #0277bd; } /* blau: → Prozent */
        .dir-to-frac::before { background: #558b2f; } /* grün: → Bruch   */

        .task-num {
            position: absolute; top: 8px; left: 10px;
            font-size: 1.1rem; font-weight: bold; color: var(--accent-color);
        }

        .dir-badge {
            position: absolute; top: 8px; right: 9px;
            font-size: 0.6rem; font-weight: bold;
            padding: 2px 6px; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .dir-to-pct  .dir-badge { background: #bbdefb; color: #0277bd; }
        .dir-to-frac .dir-badge { background: #dcedc8; color: #558b2f; }

        .question {
            font-size: clamp(1.1rem, 3.2vh, 2.6rem);
            color: var(--accent-color);
            margin-bottom: 4px;
            text-align: center;
            padding: 0 8px;
        }
        .show-sol .question { opacity: 0.2; }

        .solution {
            font-size: clamp(1.15rem, 3.4vh, 2.7rem);
            color: var(--sol-color); font-weight: bold;
            border-top: 2px dashed #ccc;
            width: 70%; text-align: center;
            padding-top: 4px;
            visibility: hidden;
        }
        .show-sol .solution { visibility: visible; }

        @media (max-width: 900px) { h1 { display: none; } }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="controls">
            <button class="back-btn" onclick="history.back()" title="Zurück">←</button>
        </div>
        <h1>Brüche ↔ Prozent umrechnen</h1>
    </div>

    <div class="timer-container">
        <div class="controls"><button onclick="adjustTime(-60)">-1m</button></div>
        <div id="timer-display">15:00</div>
        <div class="controls">
            <button onclick="adjustTime(60)">+1m</button>
            <button id="startStopBtn" onclick="toggleTimer()">▶ Start</button>
            <button onclick="resetTimer()">↻</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleAllSolutions()">👁 Lösungen</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
</header>

<main id="task-grid"></main>

<script>
    /*
     * dir: "pct"  → Bruch gegeben, Prozent gesucht
     * dir: "frac" → Prozent gegeben, (gekürzter) Bruch gesucht
     */
    const tasks = [
        // ── Stufe 1: Bruch → Prozent, einfache Nenner ──────────────────────
        { dir:"pct",
          q: "\\frac{1}{2} = \\square\\,\\%",
          a: "50\\,\\%" },
        { dir:"pct",
          q: "\\frac{1}{4} = \\square\\,\\%",
          a: "25\\,\\%" },
        { dir:"pct",
          q: "\\frac{3}{4} = \\square\\,\\%",
          a: "75\\,\\%" },
        { dir:"pct",
          q: "\\frac{1}{5} = \\square\\,\\%",
          a: "20\\,\\%" },
        { dir:"pct",
          q: "\\frac{3}{5} = \\square\\,\\%",
          a: "60\\,\\%" },
        { dir:"pct",
          q: "\\frac{1}{10} = \\square\\,\\%",
          a: "10\\,\\%" },

        // ── Stufe 2: Bruch → Prozent, Nenner 20 und 25 ─────────────────────
        { dir:"pct",
          q: "\\frac{7}{10} = \\square\\,\\%",
          a: "70\\,\\%" },
        { dir:"pct",
          q: "\\frac{1}{20} = \\square\\,\\%",
          a: "5\\,\\%" },
        { dir:"pct",
          q: "\\frac{3}{20} = \\square\\,\\%",
          a: "15\\,\\%" },
        { dir:"pct",
          q: "\\frac{11}{20} = \\square\\,\\%",
          a: "55\\,\\%" },
        { dir:"pct",
          q: "\\frac{3}{25} = \\square\\,\\%",
          a: "12\\,\\%" },
        { dir:"pct",
          q: "\\frac{9}{25} = \\square\\,\\%",
          a: "36\\,\\%" },

        // ── Stufe 3: Prozent → gekürzter Bruch ─────────────────────────────
        { dir:"frac",
          q: "25\\,\\% = \\square",
          a: "\\frac{1}{4}" },
        { dir:"frac",
          q: "40\\,\\% = \\square",
          a: "\\frac{2}{5}" },
        { dir:"frac",
          q: "30\\,\\% = \\square",
          a: "\\frac{3}{10}" },
        { dir:"frac",
          q: "80\\,\\% = \\square",
          a: "\\frac{4}{5}" },
        { dir:"frac",
          q: "15\\,\\% = \\square",
          a: "\\frac{3}{20}" },
        { dir:"frac",
          q: "35\\,\\% = \\square",
          a: "\\frac{7}{20}" },
    ];

    let timeLeft = 900;
    let timerInterval = null;

    function initGrid() {
        const grid = document.getElementById('task-grid');
        grid.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        tasks.forEach((task, index) => {
            const card = document.createElement('div');
            card.className = `task-card dir-to-${task.dir === 'pct' ? 'pct' : 'frac'}`;
            const label = alphabet[index];
            const badgeText = task.dir === 'pct' ? '→ Prozent' : '→ Bruch';

            card.innerHTML = `
                <div class="task-num">${label}</div>
                <div class="dir-badge">${badgeText}</div>
                <div class="question">\\(${task.q}\\)</div>
                <div class="solution">\\(${task.a}\\)</div>
            `;

            card.onclick = () => card.classList.toggle('show-sol');
            grid.appendChild(card);
        });

        if (window.MathJax) MathJax.typesetPromise();
    }

    function updateTimerDisplay() {
        const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const sec = (timeLeft % 60).toString().padStart(2, '0');
        const d = document.getElementById('timer-display');
        d.innerText = `${min}:${sec}`;
        d.style.backgroundColor = timeLeft === 0 ? 'var(--timer-alert)' : 'var(--timer-bg)';
        d.style.color = timeLeft === 0 ? 'white' : 'var(--accent-color)';
    }

    function toggleTimer() {
        const btn = document.getElementById('startStopBtn');
        if (timerInterval) {
            clearInterval(timerInterval); timerInterval = null;
            btn.innerText = "▶ Start";
        } else {
            if (timeLeft <= 0) return;
            btn.innerText = "Ⅱ Pause";
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval); timerInterval = null;
                    btn.innerText = "▶ Start";
                }
            }, 1000);
        }
    }

    function resetTimer() {
        if (timerInterval) toggleTimer();
        timeLeft = 900; updateTimerDisplay();
    }

    function adjustTime(amount) {
        timeLeft = Math.max(0, timeLeft + amount); updateTimerDisplay();
    }

    function toggleAllSolutions() {
        const cards = document.querySelectorAll('.task-card');
        const anyVisible = [...cards].some(c => c.classList.contains('show-sol'));
        cards.forEach(c => anyVisible
            ? c.classList.remove('show-sol')
            : c.classList.add('show-sol'));
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    }

    window.onload = () => { initGrid(); updateTimerDisplay(); };
</script>
</body>
</html>
